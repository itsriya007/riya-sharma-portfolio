services:
  - type: web
    name: riya-sharma-portfolio
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: RECIPIENT_EMAIL
        value: riya0077224@gmail.com
      - key: SMTP_SERVICE
        value: gmail
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 465
      - key: SMTP_SECURE
        value: true
      - key: SMTP_USER
        value: riya0077224@gmail.com
      - key: SMTP_PASS
        sync: false
